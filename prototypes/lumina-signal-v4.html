<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Lumina Signal — High-signal AI voices</title>
  <meta name="description" content="Suivre les personnes qui parlent sérieusement d'IA. Feed live, briefing du jour, curation high-signal.">
  <meta name="theme-color" content="#0a0a0f">
  <meta property="og:title" content="Lumina Signal">
  <meta property="og:description" content="High-signal AI voices, live. Briefing du jour + feed curaté.">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://annuaireluminaia.github.io/lumina-signal-ai/">
  <link rel="icon" href="../favicon.svg" type="image/svg+xml">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #050507;
      --bg-sidebar: #08080c;
      --bg-card: #0c0c11;
      --bg-card-hover: #101016;
      --border: rgba(255,255,255,0.06);
      --border-strong: rgba(255,255,255,0.1);
      --text: #fafafa;
      --text-2: #a1a1aa;
      --text-3: #71717a;
      --accent: #a78bfa;
      --accent-dim: rgba(167, 139, 250, 0.12);
      --green: #34d399;
      --radius: 14px;
      --radius-sm: 9px;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      -webkit-font-smoothing: antialiased;
      line-height: 1.5;
    }
    .header {
      height: 52px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 20px 0 18px;
      border-bottom: 1px solid var(--border);
      background: rgba(5,5,7,0.85);
      backdrop-filter: blur(16px);
      position: sticky;
      top: 0;
      z-index: 50;
    }
    .logo {
      display: flex;
      align-items: center;
      gap: 9px;
      font-size: 14.5px;
      font-weight: 600;
      letter-spacing: -0.03em;
      color: inherit;
      text-decoration: none;
      cursor: pointer;
    }
    .logo:hover { opacity: 0.85; }
    .logo-icon {
      width: 22px; height: 22px;
      border-radius: 7px;
      background: linear-gradient(145deg, #8b5cf6, #6366f1);
      display: grid; place-items: center;
      font-size: 11px;
      box-shadow: 0 0 0 1px rgba(139,92,246,0.3), 0 4px 12px rgba(139,92,246,0.25);
    }
    .nav {
      display: flex;
      gap: 2px;
      background: rgba(255,255,255,0.03);
      padding: 3px;
      border-radius: 9px;
      border: 1px solid var(--border);
    }
    .nav button {
      background: none; border: none;
      color: var(--text-3);
      font-size: 13px; font-weight: 500;
      padding: 5px 14px;
      border-radius: 6px;
      cursor: pointer;
      font-family: inherit;
      transition: all 0.15s;
    }
    .nav button:hover { color: var(--text-2); }
    .nav button.active {
      background: rgba(255,255,255,0.07);
      color: var(--text);
    }
    .header-actions { display: flex; align-items: center; gap: 10px; }
    .lang {
      display: flex;
      background: rgba(255,255,255,0.03);
      border: 1px solid var(--border);
      border-radius: 7px;
      overflow: hidden;
      font-size: 11.5px; font-weight: 600;
    }
    .lang span {
      padding: 4px 9px; cursor: pointer; color: var(--text-3);
    }
    .lang span.active {
      background: var(--accent-dim); color: var(--accent);
    }
    .shell {
      display: grid;
      grid-template-columns: 240px 1fr 320px;
      height: calc(100vh - 52px);
    }
    .sidebar {
      background: var(--bg-sidebar);
      border-right: 1px solid var(--border);
      padding: 18px 12px;
      overflow-y: auto;
    }
    .side-label {
      font-size: 10.5px; font-weight: 600;
      letter-spacing: 0.06em; text-transform: uppercase;
      color: var(--text-3);
      padding: 0 8px; margin-bottom: 8px; margin-top: 6px;
    }
    .side-item {
      display: flex; align-items: center; gap: 9px;
      padding: 7px 8px; border-radius: 8px;
      font-size: 13px; color: var(--text-2);
      cursor: pointer; transition: all 0.12s;
      margin-bottom: 1px; border: none; background: none;
      width: 100%; text-align: left; font-family: inherit;
    }
    .side-item:hover { background: rgba(255,255,255,0.035); color: var(--text); }
    .side-item.active { background: var(--accent-dim); color: #c4b5fd; }
    .divider { height: 1px; background: var(--border); margin: 16px 8px; }
    .main { overflow-y: auto; padding: 24px 28px 80px; }
    .feed-header {
      display: flex; align-items: flex-end;
      justify-content: space-between; margin-bottom: 22px;
    }
    .feed-title {
      font-family: 'Instrument Serif', Georgia, serif;
      font-size: 26px; font-weight: 400;
      letter-spacing: -0.03em; line-height: 1.1;
    }
    .feed-sub { font-size: 13px; color: var(--text-3); margin-top: 3px; }
    .btn {
      display: inline-flex; align-items: center; gap: 6px;
      height: 32px; padding: 0 13px; border-radius: 8px;
      font-size: 12.5px; font-weight: 550;
      border: none; cursor: pointer; transition: all 0.15s;
      font-family: inherit;
    }
    .btn-primary {
      background: linear-gradient(180deg, #a78bfa, #8b5cf6);
      color: #fff;
      box-shadow: 0 1px 0 rgba(255,255,255,0.12) inset, 0 4px 12px rgba(139,92,246,0.3);
    }
    .btn-primary:hover { filter: brightness(1.08); }
    .btn-ghost {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--text-2);
    }
    .btn-ghost:hover {
      border-color: var(--border-strong);
      color: var(--text);
      background: rgba(255,255,255,0.03);
    }
    .feed { display: flex; flex-direction: column; gap: 10px; }
    .card {
      display: flex; gap: 14px; padding: 14px;
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      cursor: pointer; transition: all 0.18s;
    }
    .card:hover {
      background: var(--bg-card-hover);
      border-color: var(--border-strong);
      transform: translateY(-1px);
      box-shadow: 0 8px 24px rgba(0,0,0,0.25);
    }
    .thumb {
      width: 120px; height: 68px;
      border-radius: 9px; flex-shrink: 0;
      display: grid; place-items: center;
      font-size: 10px; font-weight: 600;
      letter-spacing: 0.04em;
      color: rgba(255,255,255,0.35);
    }
    .thumb.video { background: linear-gradient(145deg, #1e1b4b, #312e81); }
    .thumb.podcast { background: linear-gradient(145deg, #0f172a, #1e3a5f); }
    .card-content { flex: 1; min-width: 0; }
    .card-top {
      display: flex; align-items: center; gap: 7px;
      font-size: 12px; color: var(--text-3); margin-bottom: 5px;
    }
    .card-top .name { color: var(--text-2); font-weight: 500; }
    .badge {
      margin-left: auto;
      font-size: 11px; font-weight: 600;
      color: #c4b5fd; background: var(--accent-dim);
      padding: 2px 7px; border-radius: 5px;
    }
    .card-title {
      font-size: 14.5px; font-weight: 560;
      letter-spacing: -0.015em; line-height: 1.35; margin-bottom: 5px;
    }
    .card-excerpt {
      font-size: 12.5px; color: var(--text-3); line-height: 1.45;
      display: -webkit-box; -webkit-line-clamp: 2;
      -webkit-box-orient: vertical; overflow: hidden;
    }
    /* Voices grid */
    .voices-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 12px;
    }
    .voice-card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 18px;
      cursor: pointer;
      transition: all 0.18s;
    }
    .voice-card:hover {
      border-color: var(--border-strong);
      background: var(--bg-card-hover);
      transform: translateY(-1px);
    }
    .voice-card h3 {
      font-size: 15px; font-weight: 600;
      letter-spacing: -0.02em; margin-bottom: 2px;
    }
    .voice-role { font-size: 12.5px; color: var(--text-3); margin-bottom: 10px; }
    .voice-meta {
      display: flex; align-items: center; gap: 8px;
      font-size: 12px; color: var(--text-3); margin-bottom: 12px;
    }
    .score-pill {
      background: var(--accent-dim); color: #c4b5fd;
      font-weight: 600; padding: 2px 8px; border-radius: 5px;
      font-size: 12px;
    }
    .voice-bio {
      font-size: 12.5px; color: var(--text-2);
      line-height: 1.5;
      display: -webkit-box; -webkit-line-clamp: 3;
      -webkit-box-orient: vertical; overflow: hidden;
    }
    .tags { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 12px; }
    .tag {
      font-size: 11px; padding: 2px 8px; border-radius: 5px;
      background: rgba(255,255,255,0.03);
      border: 1px solid var(--border); color: var(--text-3);
    }
    .voice-links {
      display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px;
    }
    .vlink {
      font-size: 11.5px; font-weight: 500;
      color: #c4b5fd; text-decoration: none;
      padding: 3px 8px; border-radius: 5px;
      background: var(--accent-dim);
      border: 1px solid rgba(167,139,250,0.2);
      transition: all 0.12s;
    }
    .vlink:hover {
      background: rgba(167,139,250,0.25);
      color: #e9e0ff;
    }
    /* Assistant */
    .assistant-panel {
      border-left: 1px solid var(--border);
      background: var(--bg-sidebar);
      display: flex; flex-direction: column; overflow: hidden;
    }
    .assistant-header {
      padding: 16px 18px 14px;
      border-bottom: 1px solid var(--border);
      display: flex; align-items: center; justify-content: space-between;
    }
    .assistant-title {
      font-size: 13.5px; font-weight: 600;
      display: flex; align-items: center; gap: 8px;
    }
    .assistant-title span {
      width: 8px; height: 8px; border-radius: 50%;
      background: var(--green);
      box-shadow: 0 0 0 3px rgba(52,211,153,0.2);
    }
    .assistant-body {
      flex: 1; padding: 18px; overflow-y: auto;
      display: flex; flex-direction: column; gap: 14px;
    }
    .msg {
      max-width: 95%; font-size: 13px; line-height: 1.5;
    }
    .msg.bot {
      background: rgba(255,255,255,0.03);
      border: 1px solid var(--border);
      border-radius: 12px 12px 12px 4px;
      padding: 12px 14px; color: var(--text-2);
    }
    .msg.bot strong { color: var(--text); font-weight: 560; }
    .suggestions {
      display: flex; flex-direction: column; gap: 6px;
    }
    .suggestion {
      font-size: 12.5px; padding: 8px 12px;
      border-radius: 8px; border: 1px solid var(--border);
      background: transparent; color: var(--text-3);
      text-align: left; cursor: pointer;
      font-family: inherit; transition: all 0.12s;
    }
    .suggestion:hover {
      border-color: rgba(167,139,250,0.3);
      color: #c4b5fd; background: var(--accent-dim);
    }
    .assistant-input {
      padding: 14px 16px; border-top: 1px solid var(--border);
    }
    .input-wrap {
      display: flex; gap: 8px;
      background: rgba(255,255,255,0.03);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 6px 6px 6px 14px;
    }
    .input-wrap:focus-within { border-color: rgba(167,139,250,0.4); }
    .input-wrap input {
      flex: 1; background: transparent; border: none;
      outline: none; color: var(--text);
      font-size: 13px; font-family: inherit;
    }
    .input-wrap input::placeholder { color: var(--text-3); }
    .send-btn {
      width: 32px; height: 32px; border-radius: 8px;
      border: none; background: var(--accent); color: white;
      display: grid; place-items: center; cursor: pointer;
      font-size: 14px;
    }
    .hidden { display: none !important; }
    .empty {
      text-align: center; padding: 60px 20px;
      color: var(--text-3); font-size: 14px;
    }
    @media (max-width: 1100px) {
      .shell { grid-template-columns: 220px 1fr; }
      .assistant-panel { display: none; }
    }
  </style>
</head>

    // ——— State ———
    let currentView = "feed";
    let categoryFilter = "all";

    // ——— Helpers ———
    function getVoice(id) {
      return VOICES.find(v => v.id === id);
    }

    function formatDuration(s) {
      return s; // already formatted in sample

    // ——— Render Feed ———
    function renderFeed() {
      const list = document.getElementById("feed-list");
      let items = CONTENTS;

      if (categoryFilter !== "all") {
        items = items.filter(c => {
          const v = getVoice(c.voiceId);
          return v && v.categories.includes(categoryFilter);
        });
      }
      if (countryFilter !== "all") {
        items = items.filter(c => {
          const v = getVoice(c.voiceId);
          return v && v.countryCode === countryFilter;
        });
      }

      document.getElementById("feed-meta").textContent =
        items.length + " contenu" + (items.length > 1 ? "s" : "") + " · live RSS";

      if (items.length === 0) {
        list.innerHTML = `<div class="empty">Aucun contenu pour ce filtre.</div>`;
        return;
      }

      list.innerHTML = items.map(c => {
        const v = getVoice(c.voiceId) || { name: c.voiceId };
        const openAttr = c.url ? `onclick="window.open('${c.url}', '_blank')"` : "";
        return `
          <article class="card" ${openAttr} style="${c.url ? 'cursor:pointer' : ''}">
            <div class="thumb ${c.type}">${c.type === "video" ? "YT" : "POD"}</div>
            <div class="card-content">
              <div class="card-top">
                <span class="name">${v.name}</span>
                <span>·</span>
                <span>${c.duration}</span>
                <span>·</span>
                <span>${c.ago}</span>
                <span class="badge">${c.signalScore}</span>
              </div>
              <h3 class="card-title">${c.title}</h3>
              <p class="card-excerpt">${c.description || (c.url ? "Ouvrir le contenu →" : "")}</p>
            </div>
          </article>
        `;
      }).join("");
    }

    // ——— Render Voices ———
    function renderVoices() {
      const list = document.getElementById("voices-list");
      let items = [...VOICES];

      if (categoryFilter !== "all") {
        items = items.filter(v => v.categories.includes(categoryFilter));
      }
      if (countryFilter !== "all") {
        items = items.filter(v => v.countryCode === countryFilter);
      }

      document.getElementById("voices-meta").textContent =
        items.length + " voix" + (categoryFilter !== "all" || countryFilter !== "all" ? " (filtrées)" : " sélectionnées");

      if (items.length === 0) {
        list.innerHTML = `<div class="empty">Aucune voix pour ce filtre.</div>`;
        return;
      }

      list.innerHTML = items.map(v => {
        const links = v.links || {};
        const linkHtml = [
          links.youtube ? `<a class="vlink" href="${links.youtube}" target="_blank" rel="noopener" onclick="event.stopPropagation()">YouTube</a>` : "",
          links.x ? `<a class="vlink" href="${links.x}" target="_blank" rel="noopener" onclick="event.stopPropagation()">X</a>` : "",

        <div class="voice-card" data-id="${v.id}">
          <h3>${v.name}</h3>

    // ——— Navigation ———
    function setView(view) {
      currentView = view;
      document.querySelectorAll(".nav button").forEach(b => {
        b.classList.toggle("active", b.dataset.view === view);
      });
      document.getElementById("view-feed").classList.toggle("hidden", view !== "feed");
      document.getElementById("view-voices").classList.toggle("hidden", view !== "voices");

      if (view === "feed") renderFeed();
      if (view === "voices") renderVoices();
    }

    // ——— Filters ———
    function setCategory(cat) {
      categoryFilter = cat;
      document.querySelectorAll("[data-filter]").forEach(el => {
        el.classList.toggle("active", el.dataset.filter === cat);
      });
      if (currentView === "feed") renderFeed();
      if (currentView === "voices") renderVoices();
    }

    function setCountry(code) {
      countryFilter = code;
      document.querySelectorAll("[data-country]").forEach(el => {
        el.classList.toggle("active", el.dataset.country === code);
      });
      if (currentView === "feed") renderFeed();
      if (currentView === "voices") renderVoices();
    }

    // ——— Assistant (simple demo) ———
    function askAssistant(q) {

      if (t.includes("open") && (t.includes("weight") || t.includes("source") || t.includes("model"))) return "Open-weight / open models — enjeu stratégique.";

      if (t.includes("europe") || t.includes("mistral") || t.includes("souverain")) return "Angle européen / souveraineté.";
      return voiceWhy[c.voiceId] || "Signal élevé de cette voix.";
    }

    function openBriefing() {
      let top;
      if (typeof BRIEFING !== "undefined" && BRIEFING.items && BRIEFING.items.length) {
        top = BRIEFING.items.map(it => ({
          title: it.title, voiceId: it.voiceId, signalScore: it.signalScore,
          ago: it.ago, url: it.url, _why: it.why, _voiceName: it.voiceName
        }));
      } else {
        const seen = new Set();
        top = [];
        const sorted = [...CONTENTS].sort((a, b) => (b.signalScore || 0) - (a.signalScore || 0));
        for (const c of sorted) {
          if (seen.has(c.voiceId)) continue;
          seen.add(c.voiceId);
          top.push(c);
          if (top.length >= 7) break;
        }
      }

      const subtitle = (typeof BRIEFING !== "undefined" && BRIEFING.summary)
        ? BRIEFING.summary
        : "Top signaux · diversifiés par voix";

      let html = `<div style="position:fixed;inset:0;background:rgba(0,0,0,0.7);z-index:100;display:flex;align-items:center;justify-content:center;padding:20px" id="briefing-modal">

          <div style="display:flex;flex-direction:column;gap:14px">`;

      top.forEach((c, i) => {
        const v = getVoice(c.voiceId) || { name: c._voiceName || c.voiceId };
        const why = c._why || getWhy(c);
        html += `
          <div style="padding:14px;background:rgba(255,255,255,0.03);border:1px solid rgba(255,255,255,0.06);border-radius:12px;cursor:pointer" ${c.url ? `onclick="window.open('${c.url}','_blank')"` : ""}>
            <div style="display:flex;align-items:center;gap:8px;font-size:12px;color:#71717a;margin-bottom:6px">
              <span style="font-weight:600;color:#c4b5fd">${i + 1}</span>
              <span>${v.name || c._voiceName || c.voiceId}</span>
              <span>·</span>
              <span>${c.ago || ""}</span>
              <span style="margin-left:auto;background:rgba(167,139,250,0.12);color:#c4b5fd;padding:2px 7px;border-radius:5px;font-weight:600">${c.signalScore}</span>
            </div>
            <div style="font-size:14px;font-weight:560;margin-bottom:6px;letter-spacing:-0.01em">${c.title}</div>
            <div style="font-size:12.5px;color:#a1a1aa;line-height:1.45">${why}</div>
          </div>`;
      });

      html += `</div>
          <div style="margin-top:18px;font-size:12px;color:#52525b;text-align:center">Clique sur un item pour ouvrir · Généré à partir des flux live</div>
        </div>
      </div>`;

      document.body.insertAdjacentHTML("beforeend", html);
    }

    document.querySelector(".btn-primary")?.addEventListener("click", openBriefing);

    // ——— Load live data from JSON (auto-updated by robot) ———
    async function loadLiveData() {
      try {
        const [liveRes, briefRes] = await Promise.all([
          fetch("../data/live-contents.json", { cache: "no-store" }),
          fetch("../data/briefing-latest.json", { cache: "no-store" })
        ]);
        if (liveRes.ok) {
          const live = await liveRes.json();
          if (live.contents && live.contents.length) {
            CONTENTS = live.contents.map(c => ({
              id: c.id,
              voiceId: c.voiceId,
              type: c.type || "video",
              title: c.title,
              description: c.description || "",
              duration: c.duration || "—",
              ago: c.ago || "",
              signalScore: c.signalScore || 8,
              url: c.url || ""
            }));
            console.log("[Lumina] Live contents:", CONTENTS.length);
          }
        }
        if (briefRes.ok) {
          const b = await briefRes.json();
          if (b.items) {
            BRIEFING = b;
            console.log("[Lumina] Briefing:", b.items.length, "items");
          }
        }
      } catch (e) {
        console.warn("[Lumina] Live fetch failed, using embedded data", e);
      }
      renderFeed();
    }

    // Init
    loadLiveData();
  </script>
