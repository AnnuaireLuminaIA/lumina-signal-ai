<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Lumina Signal — High-signal AI voices</title>
  <meta name="description" content="Suivre les personnes qui parlent sérieusement d'IA. Feed live, briefing du jour, curation high-signal.">
  <meta name="theme-color" content="#0a0a0f">
  <meta property="og:title" content="Lumina Signal">
  <meta property="og:description" content="High-signal AI voices, live. Briefing du jour + feed curaté.">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://annuaireluminaia.github.io/lumina-signal-ai/">
  <link rel="icon" href="../favicon.svg" type="image/svg+xml">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #050507;
      --bg-sidebar: #08080c;
      --bg-card: #0c0c11;
      --bg-card-hover: #101016;
      --border: rgba(255,255,255,0.06);
      --border-strong: rgba(255,255,255,0.1);
      --text: #fafafa;
      --text-2: #a1a1aa;
      --text-3: #71717a;
      --accent: #a78bfa;
      --accent-dim: rgba(167, 139, 250, 0.12);
      --green: #34d399;
      --radius: 14px;
      --radius-sm: 9px;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      -webkit-font-smoothing: antialiased;
      line-height: 1.5;
    }
    .header {
      height: 52px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 20px 0 18px;
      border-bottom: 1px solid var(--border);
      background: rgba(5,5,7,0.85);
      backdrop-filter: blur(16px);
      position: sticky;
      top: 0;
      z-index: 50;
    }
    .logo {
      display: flex;
      align-items: center;
      gap: 9px;
      font-size: 14.5px;
      font-weight: 600;
      letter-spacing: -0.03em;
      color: inherit;
      text-decoration: none;
      cursor: pointer;
    }
    .logo:hover { opacity: 0.85; }

    .home-btn {
      display: inline-flex;
      align-items: center;
      font-size: 13px;
      font-weight: 500;
      color: #c4b5fd;
      text-decoration: none;
      padding: 6px 12px;
      border-radius: 8px;
      border: 1px solid rgba(167,139,250,0.35);
      background: rgba(167,139,250,0.1);
      margin-right: 10px;
      white-space: nowrap;
    }
    .home-btn:hover {
      background: rgba(167,139,250,0.2);
      color: #fff;
    }

    .logo-icon {
      width: 22px; height: 22px;
      border-radius: 7px;
      background: linear-gradient(145deg, #8b5cf6, #6366f1);
      display: grid; place-items: center;
      font-size: 11px;
      box-shadow: 0 0 0 1px rgba(139,92,246,0.3), 0 4px 12px rgba(139,92,246,0.25);
    }
    .nav {
      display: flex;
      gap: 2px;
      background: rgba(255,255,255,0.03);
      padding: 3px;
      border-radius: 9px;
      border: 1px solid var(--border);
    }
    .nav button {
      background: none; border: none;
      color: var(--text-3);
      font-size: 13px; font-weight: 500;
      padding: 5px 14px;
      border-radius: 6px;
      cursor: pointer;
      font-family: inherit;
      transition: all 0.15s;
    }
    .nav button:hover { color: var(--text-2); }
    .nav button.active {
      background: rgba(255,255,255,0.07);
      color: var(--text);
    }
    .header-actions { display: flex; align-items: center; gap: 10px; }
    .lang {
      display: flex;
      background: rgba(255,255,255,0.03);
      border: 1px solid var(--border);
      border-radius: 7px;
      overflow: hidden;
      font-size: 11.5px; font-weight: 600;
    }
    .lang span {
      padding: 4px 9px; cursor: pointer; color: var(--text-3);
    }
    .lang span.active {
      background: var(--accent-dim); color: var(--accent);
    }
    .shell {
      display: grid;
      grid-template-columns: 240px 1fr 320px;
      height: calc(100vh - 52px);
    }
    .sidebar {
      background: var(--bg-sidebar);
      border-right: 1px solid var(--border);
      padding: 18px 12px;
      overflow-y: auto;
    }
    .side-label {
      font-size: 10.5px; font-weight: 600;
      letter-spacing: 0.06em; text-transform: uppercase;
      color: var(--text-3);
      padding: 0 8px; margin-bottom: 8px; margin-top: 6px;
    }
    .side-item {
      display: flex; align-items: center; gap: 9px;
      padding: 7px 8px; border-radius: 8px;
      font-size: 13px; color: var(--text-2);
      cursor: pointer; transition: all 0.12s;
      margin-bottom: 1px; border: none; background: none;
      width: 100%; text-align: left; font-family: inherit;
    }
    .side-item:hover { background: rgba(255,255,255,0.035); color: var(--text); }
    .side-item.active { background: var(--accent-dim); color: #c4b5fd; }
    .divider { height: 1px; background: var(--border); margin: 16px 8px; }
    .main { overflow-y: auto; padding: 24px 28px 80px; }
    .feed-header {
      display: flex; align-items: flex-end;
      justify-content: space-between; margin-bottom: 22px;
    }
    .feed-title {
      font-family: 'Instrument Serif', Georgia, serif;
      font-size: 26px; font-weight: 400;
      letter-spacing: -0.03em; line-height: 1.1;
    }
    .feed-sub { font-size: 13px; color: var(--text-3); margin-top: 3px; }
    .btn {
      display: inline-flex; align-items: center; gap: 6px;
      height: 32px; padding: 0 13px; border-radius: 8px;
      font-size: 12.5px; font-weight: 550;
      border: none; cursor: pointer; transition: all 0.15s;
      font-family: inherit;
    }
    .btn-primary {
      background: linear-gradient(180deg, #a78bfa, #8b5cf6);
      color: #fff;
      box-shadow: 0 1px 0 rgba(255,255,255,0.12) inset, 0 4px 12px rgba(139,92,246,0.3);
    }
    .btn-primary:hover { filter: brightness(1.08); }
    .btn-ghost {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--text-2);
    }
    .btn-ghost:hover {
      border-color: var(--border-strong);
      color: var(--text);
      background: rgba(255,255,255,0.03);
    }
    .feed { display: flex; flex-direction: column; gap: 10px; }
    .card {
      display: flex; gap: 14px; padding: 14px;
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      cursor: pointer; transition: all 0.18s;
    }
    .card:hover {
      background: var(--bg-card-hover);
      border-color: var(--border-strong);
      transform: translateY(-1px);
      box-shadow: 0 8px 24px rgba(0,0,0,0.25);
    }
    .thumb {
      width: 128px; height: 72px;
      border-radius: 9px; flex-shrink: 0;
      display: grid; place-items: center;
      font-size: 10px; font-weight: 600;
      letter-spacing: 0.04em;
      color: rgba(255,255,255,0.35);
      overflow: hidden;
      background: #12121a;
      position: relative;
    }
    .thumb img {
      width: 100%; height: 100%;
      object-fit: cover;
      display: block;
    }
    .thumb.video { background: linear-gradient(145deg, #1e1b4b, #312e81); }
    .thumb.podcast { background: linear-gradient(145deg, #0f172a, #1e3a5f); }
    .thumb .play {
      position: absolute; inset: 0;
      display: grid; place-items: center;
      background: rgba(0,0,0,0.25);
      opacity: 0; transition: opacity 0.15s;
      font-size: 18px; color: #fff;
    }
    .card:hover .thumb .play { opacity: 1; }
    .card-content { flex: 1; min-width: 0; }
    .card-top {
      display: flex; align-items: center; gap: 7px;
      font-size: 12px; color: var(--text-3); margin-bottom: 5px;
    }
    .card-top .name { color: var(--text-2); font-weight: 500; }
    .badge {
      margin-left: auto;
      font-size: 11px; font-weight: 600;
      color: #c4b5fd; background: var(--accent-dim);
      padding: 2px 7px; border-radius: 5px;
    }
    .card-title {
      font-size: 14.5px; font-weight: 560;
      letter-spacing: -0.015em; line-height: 1.35; margin-bottom: 5px;
    }
    .card-excerpt {
      font-size: 12.5px; color: var(--text-3); line-height: 1.45;
      display: -webkit-box; -webkit-line-clamp: 2;
      -webkit-box-orient: vertical; overflow: hidden;
    }
    /* Voices grid */
    .voices-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 12px;
    }
    .voice-card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 18px;
      cursor: pointer;
      transition: all 0.18s;
    }
    .voice-card:hover {
      border-color: var(--border-strong);
      background: var(--bg-card-hover);
      transform: translateY(-1px);
    }
    .voice-card h3 {
      font-size: 15px; font-weight: 600;
      letter-spacing: -0.02em; margin-bottom: 2px;
    }
    .voice-role { font-size: 12.5px; color: var(--text-3); margin-bottom: 10px; }
    .voice-meta {
      display: flex; align-items: center; gap: 8px;
      font-size: 12px; color: var(--text-3); margin-bottom: 12px;
    }
    .score-pill {
      background: var(--accent-dim); color: #c4b5fd;
      font-weight: 600; padding: 2px 8px; border-radius: 5px;
      font-size: 12px;
    }
    .voice-bio {
      font-size: 12.5px; color: var(--text-2);
      line-height: 1.5;
      display: -webkit-box; -webkit-line-clamp: 3;
      -webkit-box-orient: vertical; overflow: hidden;
    }
    .tags { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 12px; }
    .tag {
      font-size: 11px; padding: 2px 8px; border-radius: 5px;
      background: rgba(255,255,255,0.03);
      border: 1px solid var(--border); color: var(--text-3);
    }
    .voice-links {
      display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px;
    }
    .vlink {
      font-size: 11.5px; font-weight: 500;
      color: #c4b5fd; text-decoration: none;
      padding: 3px 8px; border-radius: 5px;
      background: var(--accent-dim);
      border: 1px solid rgba(167,139,250,0.2);
      transition: all 0.12s;
    }
    .vlink:hover {
      background: rgba(167,139,250,0.25);
      color: #e9e0ff;
    }
    /* Assistant */
    .assistant-panel {
      border-left: 1px solid var(--border);
      background: var(--bg-sidebar);
      display: flex; flex-direction: column; overflow: hidden;
    }
    .assistant-header {
      padding: 16px 18px 14px;
      border-bottom: 1px solid var(--border);
      display: flex; align-items: center; justify-content: space-between;
    }
    .assistant-title {
      font-size: 13.5px; font-weight: 600;
      display: flex; align-items: center; gap: 8px;
    }
    .assistant-title span {
      width: 8px; height: 8px; border-radius: 50%;
      background: var(--green);
      box-shadow: 0 0 0 3px rgba(52,211,153,0.2);
    }
    .assistant-body {
      flex: 1; padding: 18px; overflow-y: auto;
      display: flex; flex-direction: column; gap: 14px;
    }
    .msg {
      max-width: 95%; font-size: 13px; line-height: 1.5;
    }
    .msg.bot {
      background: rgba(255,255,255,0.03);
      border: 1px solid var(--border);
      border-radius: 12px 12px 12px 4px;
      padding: 12px 14px; color: var(--text-2);
    }
    .msg.bot strong { color: var(--text); font-weight: 560; }
    .suggestions {
      display: flex; flex-direction: column; gap: 6px;
    }
    .suggestion {
      font-size: 12.5px; padding: 8px 12px;
      border-radius: 8px; border: 1px solid var(--border);
      background: transparent; color: var(--text-3);
      text-align: left; cursor: pointer;
      font-family: inherit; transition: all 0.12s;
    }
    .suggestion:hover {
      border-color: rgba(167,139,250,0.3);
      color: #c4b5fd; background: var(--accent-dim);
    }
    .assistant-input {
      padding: 14px 16px; border-top: 1px solid var(--border);
    }
    .input-wrap {
      display: flex; gap: 8px;
      background: rgba(255,255,255,0.03);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 6px 6px 6px 14px;
    }
    .input-wrap:focus-within { border-color: rgba(167,139,250,0.4); }
    .input-wrap input {
      flex: 1; background: transparent; border: none;
      outline: none; color: var(--text);
      font-size: 13px; font-family: inherit;
    }
    .input-wrap input::placeholder { color: var(--text-3); }
    .send-btn {
      width: 32px; height: 32px; border-radius: 8px;
      border: none; background: var(--accent); color: white;
      display: grid; place-items: center; cursor: pointer;
      font-size: 14px;
    }
    .hidden { display: none !important; }
    .empty {
      text-align: center; padding: 60px 20px;
      color: var(--text-3); font-size: 14px;
    }
    @media (max-width: 1100px) {
      .shell { grid-template-columns: 220px 1fr; }
      .assistant-panel { display: none; }
    }

    /* Search */
    .search-wrap {
      position: relative;
      margin-bottom: 14px;
    }
    .search-wrap input {
      width: 100%;
      background: rgba(255,255,255,0.04);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 10px 14px 10px 38px;
      color: var(--text);
      font-size: 13.5px;
      outline: none;
      font-family: inherit;
    }
    .search-wrap input:focus {
      border-color: rgba(167,139,250,0.45);
      background: rgba(167,139,250,0.06);
    }
    .search-wrap input::placeholder { color: #52525b; }
    .search-wrap .search-icon {
      position: absolute; left: 12px; top: 50%; transform: translateY(-50%);
      color: #71717a; font-size: 14px; pointer-events: none;
    }
    /* Type chips */
    .type-chips {
      display: flex; flex-wrap: wrap; gap: 6px;
      margin-bottom: 16px;
    }
    .chip {
      font-size: 12px; font-weight: 500;
      padding: 5px 11px; border-radius: 999px;
      border: 1px solid var(--border);
      background: rgba(255,255,255,0.03);
      color: var(--text-3);
      cursor: pointer;
      font-family: inherit;
      transition: all 0.12s;
    }
    .chip:hover { border-color: rgba(167,139,250,0.35); color: var(--text); }
    .chip.active {
      background: rgba(167,139,250,0.15);
      border-color: rgba(167,139,250,0.4);
      color: #c4b5fd;
    }
    /* Fav button */
    .fav-btn {
      background: none; border: none; cursor: pointer;
      font-size: 16px; line-height: 1; padding: 4px 6px;
      opacity: 0.45; transition: opacity 0.12s, transform 0.12s;
      color: #a1a1aa;
    }
    .fav-btn:hover { opacity: 1; transform: scale(1.1); }
    .fav-btn.on { opacity: 1; color: #fbbf24; }
    .card-actions {
      display: flex; align-items: center; gap: 4px;
      margin-top: 8px;
    }
    .card-actions .act {
      font-size: 11.5px; color: #a1a1aa;
      background: rgba(255,255,255,0.04);
      border: 1px solid var(--border);
      border-radius: 6px; padding: 4px 9px;
      cursor: pointer; font-family: inherit;
    }
    .card-actions .act:hover {
      color: #c4b5fd; border-color: rgba(167,139,250,0.35);
    }
    /* Updated badge */
    .updated-badge {
      font-size: 11px; color: #71717a;
      margin-top: 4px;
    }
    .updated-badge strong { color: #a1a1aa; font-weight: 500; }
    /* Player modal */
    .player-modal {
      position: fixed; inset: 0; z-index: 200;
      background: rgba(0,0,0,0.82);
      display: flex; align-items: center; justify-content: center;
      padding: 20px;
    }
    .player-box {
      background: #0c0c11;
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 16px;
      width: min(900px, 100%);
      overflow: hidden;
      box-shadow: 0 24px 80px rgba(0,0,0,0.5);
    }
    .player-head {
      display: flex; justify-content: space-between; align-items: center;
      padding: 14px 18px; border-bottom: 1px solid rgba(255,255,255,0.06);
      gap: 12px;
    }
    .player-head h3 {
      font-size: 14px; font-weight: 560; margin: 0;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .player-head .close {
      background: none; border: none; color: #a1a1aa;
      font-size: 22px; cursor: pointer; line-height: 1; flex-shrink: 0;
    }
    .player-frame {
      position: relative; width: 100%; padding-top: 56.25%;
      background: #000;
    }
    .player-frame iframe {
      position: absolute; inset: 0; width: 100%; height: 100%; border: 0;
    }
    .player-foot {
      padding: 12px 18px; display: flex; gap: 10px; flex-wrap: wrap;
      border-top: 1px solid rgba(255,255,255,0.06);
    }

    /* Compact mode */
    body.compact .card {
      padding: 8px 10px;
      gap: 10px;
    }
    body.compact .thumb {
      width: 72px; height: 40px;
    }
    body.compact .card-title {
      font-size: 13px;
      margin-bottom: 0;
      -webkit-line-clamp: 1;
      display: -webkit-box;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }
    body.compact .card-actions { display: none; }
    body.compact .card-excerpt { display: none; }
    body.compact .card-top { margin-bottom: 2px; }
    /* Voice detail modal */
    .voice-modal-backdrop {
      position: fixed; inset: 0; z-index: 150;
      background: rgba(0,0,0,0.75);
      display: flex; align-items: center; justify-content: center;
      padding: 20px;
    }
    .voice-modal {
      background: #0c0c11;
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 16px;
      max-width: 520px; width: 100%;
      max-height: 85vh; overflow: auto;
      padding: 28px;
    }
    .voice-modal h2 {
      font-family: "Instrument Serif", Georgia, serif;
      font-size: 24px; font-weight: 400; margin: 0 0 6px;
    }
    .voice-modal .role { color: #a1a1aa; font-size: 13.5px; margin-bottom: 14px; }
    .voice-modal .meta-row {
      display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 16px;
      font-size: 12px; color: #71717a;
    }
    .voice-modal .meta-row span {
      background: rgba(255,255,255,0.04);
      border: 1px solid rgba(255,255,255,0.06);
      padding: 3px 9px; border-radius: 6px;
    }
    .voice-modal .score {
      color: #c4b5fd; background: rgba(167,139,250,0.12) !important;
      border-color: rgba(167,139,250,0.25) !important; font-weight: 600;
    }
    .voice-modal .bio { font-size: 14px; color: #d4d4d8; line-height: 1.55; margin-bottom: 12px; }
    .voice-modal .why {
      font-size: 13px; color: #a1a1aa; line-height: 1.5;
      padding: 12px; border-radius: 10px;
      background: rgba(167,139,250,0.06);
      border: 1px solid rgba(167,139,250,0.15);
      margin-bottom: 18px;
    }
    .voice-modal .links {
      display: flex; flex-wrap: wrap; gap: 8px;
    }
    .voice-modal .links a {
      font-size: 12.5px; color: #c4b5fd;
      text-decoration: none;
      padding: 7px 12px; border-radius: 8px;
      border: 1px solid rgba(167,139,250,0.3);
      background: rgba(167,139,250,0.08);
    }
    .voice-modal .links a:hover { background: rgba(167,139,250,0.18); }
    .voice-card { cursor: pointer; }
    .chip-toggle {
      margin-left: auto;
    }
    .share-row {
      display: flex; gap: 8px; flex-wrap: wrap;
      margin-top: 16px; justify-content: center;
    }
    .share-row button {
      font-size: 12px; font-family: inherit;
      padding: 7px 12px; border-radius: 8px;
      border: 1px solid rgba(255,255,255,0.1);
      background: rgba(255,255,255,0.04);
      color: #a1a1aa; cursor: pointer;
    }
    .share-row button:hover {
      color: #c4b5fd; border-color: rgba(167,139,250,0.35);
    }

    .lang-badge {
      font-size: 10px; font-weight: 600;
      padding: 1px 6px; border-radius: 4px;
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }
    .lang-badge.fr {
      background: rgba(59,130,246,0.15);
      color: #93c5fd;
      border: 1px solid rgba(59,130,246,0.3);
    }
    .lang-badge.en {
      background: rgba(255,255,255,0.05);
      color: #a1a1aa;
      border: 1px solid rgba(255,255,255,0.08);
    }
    .card-title .orig {
      display: block;
      font-size: 11.5px; font-weight: 400;
      color: #71717a; margin-top: 3px;
    }
    .settings-btn {
      font-size: 13px; cursor: pointer;
      background: none; border: none; color: #a1a1aa;
      padding: 4px 8px;
    }
    .settings-btn:hover { color: #c4b5fd; }
  </style>
</head>
<body>
  <header class="header">
    <a class="logo" href="https://annuaireluminaia.github.io/lumina-signal-ai/" title="Retour à l'accueil">
      <div class="logo-icon">✦</div>
      Lumina Signal
    </a>
    <nav class="nav">
      <button data-view="feed" class="active">Feed</button>
      <button data-view="voices">Voix</button>
      <button data-view="assistant">Assistant</button>

    // ——— Content language & Gemini title translation ———
    const titleCache = JSON.parse(localStorage.getItem("lumina-title-cache") || "{}");

    function contentLang(c) {
      if (c.language === "fr" || c.language === "en") return c.language;
      const v = getVoice(c.voiceId);
      if (v) {
        if (v.countryCode === "FR") return "fr";
        if ((v.language || []).length === 1 && v.language[0] === "fr") return "fr";
      }
      // heuristic on title
      const t = (c.title || "");
      if (/[àâäéèêëïîôùûüç]/i.test(t) || /\b(le|la|les|des|une|pour|dans|avec|sur)\b/i.test(t)) return "fr";
      return "en";
    }
    function displayTitle(c) {
      const target = lang; // UI language
      // Prefer server-side translations from live JSON
      if (target === "fr" && c.titleFr) return c.titleFr;
      if (target === "en" && c.titleEn) return c.titleEn;
      const src = contentLang(c);
      if (src === target) return c.title;
      // Client-side Gemini cache fallback
      const key = target + "::" + c.id;
      if (titleCache[key]) return titleCache[key];
      return c.title;
    }

    async function translateTitles() {
      const key = getGeminiKey();
      if (!key) {
        openSettings();
        alert(lang === "fr"
          ? "Ajoute d’abord ta clé API Gemini gratuite (Settings ⚙)."
          : "Add your free Gemini API key first (Settings ⚙).");
        return;
      }
      const target = lang;
      const need = CONTENTS.filter(c => {
        const src = contentLang(c);
        if (src === target) return false;
        return !titleCache[target + "::" + c.id];
      }).slice(0, 25); // batch limit free tier friendly
      if (!need.length) {
        alert(lang === "fr" ? "Titres déjà traduits (cache)." : "Titles already translated (cache).");
        renderFeed();
        return;
      }
      const btn = document.getElementById("translate-btn");
      if (btn) { btn.textContent = "…"; btn.disabled = true; }
      try {
        for (const c of need) {
          const src = contentLang(c);
          const prompt = src === "en"
            ? `Translate this video/podcast title to French. Return ONLY the translation, no quotes:\n${c.title}`
            : `Translate this video/podcast title to English. Return ONLY the translation, no quotes:\n${c.title}`;
          const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.0-flash:generateContent?key=${encodeURIComponent(key)}`;
          const res = await fetch(url, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
              contents: [{ parts: [{ text: prompt }] }],
              generationConfig: { temperature: 0.2, maxOutputTokens: 80 }
            })
          });
          if (!res.ok) {
            const err = await res.text();
            throw new Error("Gemini " + res.status + ": " + err.slice(0, 180));
          }
          const data = await res.json();
          const text = data?.candidates?.[0]?.content?.parts?.[0]?.text?.trim();
          if (text) {
            titleCache[target + "::" + c.id] = text.replace(/^["«]|["»]$/g, "").trim();
            saveTitleCache();
          }
        }
        renderFeed();
        alert(lang === "fr"
          ? `${need.length} titres traduits (Gemini).`
          : `${need.length} titles translated (Gemini).`);
      } catch (e) {
        console.error(e);
        alert((lang === "fr" ? "Erreur Gemini : " : "Gemini error: ") + (e.message || e));
      } finally {
        if (btn) {
          btn.disabled = false;
          btn.textContent = lang === "fr" ? "🌐 Traduire" : "🌐 Translate";
        }
      }
    }

    // ——— Render Feed ———
    function renderFeed() {
      const list = document.getElementById("feed-list");
      let items = CONTENTS;

      if (categoryFilter !== "all") {
        items = items.filter(c => {
          const v = getVoice(c.voiceId);
          return v && v.categories.includes(categoryFilter);
        });
      }
      if (countryFilter !== "all") {
        items = items.filter(c => {
          const v = getVoice(c.voiceId);
          return v && v.countryCode === countryFilter;
        });
      }
      if (typeFilter === "video" || typeFilter === "podcast") {
        items = items.filter(c => c.type === typeFilter);
      } else if (typeFilter === "fr") {
        items = items.filter(c => {
          if (c.language === "fr") return true;
          const v = getVoice(c.voiceId);
          return v && ((v.language || []).includes("fr") || v.countryCode === "FR");
        });
      } else if (typeFilter === "fav") {
        items = items.filter(c => favorites.has(c.id));
      }
      if (searchQuery.trim()) {
        const q = searchQuery.trim().toLowerCase();
        items = items.filter(c => {
          const v = getVoice(c.voiceId);
          const hay = [
            c.title || "",
            displayTitle(c) || "",
            c.description || "",
            (v && v.name) || "",
            (v && v.role) || "",
            ((v && v.categories) || []).join(" ")
          ].join(" ").toLowerCase();
          return hay.includes(q);
        });
      }

      // FR first when UI is French
      if (lang === "fr") {
        items = [...items].sort((a, b) => {
          const af = contentLang(a) === "fr" ? 0 : 1;
          const bf = contentLang(b) === "fr" ? 0 : 1;
          return af - bf;
        });
      }

      const updatedStr = lastUpdated
        ? ` · MAJ <strong>${lastUpdated}</strong>`
        : "";
      const unit = items.length > 1 ? t("contents_plural") : t("contents");
      document.getElementById("feed-meta").textContent =
        items.length + " " + unit + " · " + t("live");
      const badge = document.getElementById("updated-badge");
      if (badge) badge.innerHTML = lastUpdated ? `${t("updated")} <strong>${lastUpdated}</strong>` : "";

      if (items.length === 0) {
        list.innerHTML = `<div class="empty">${t("empty.feed")}</div>`;
        return;
      }

      list.innerHTML = items.map(c => {
        const v = getVoice(c.voiceId) || { name: c.voiceId };
        const isYt = !!ytId(c.url);
        const isFav = favorites.has(c.id);
        const openJs = isYt
          ? `openPlayer('${c.url.replace(/'/g, "\\'")}', '${(c.title || "").replace(/'/g, "\\'").replace(/"/g, "&quot;")}', event)`
          : (c.url ? `window.open('${c.url}', '_blank')` : "");
        return `
          <article class="card" style="${c.url ? 'cursor:pointer' : ''}" ${openJs ? `onclick="${openJs}"` : ""}>
            <div class="thumb ${c.type}">
              ${c.thumbnail
                ? `<img src="${c.thumbnail}" alt="" loading="lazy" referrerpolicy="no-referrer" /><span class="play">▶</span>`
                : (c.type === "video" ? "YT" : "POD")}
            </div>
            <div class="card-content">
              <div class="card-top">
                <span class="name" style="cursor:pointer" onclick="event.stopPropagation();openVoiceModal('${c.voiceId}')" title="Fiche voix">${v.name}</span>
                <span>·</span>
                <span class="lang-badge ${contentLang(c)}">${contentLang(c)}</span>
                <span>·</span>
                <span>${c.ago || c.duration || ""}</span>
                <span class="badge">${c.signalScore}</span>
              </div>
              <h3 class="card-title">${(displayTitle(c) !== c.title) ? (displayTitle(c) + '<span class="orig">' + c.title + '</span>') : displayTitle(c)}</h3>
              <div class="card-actions" onclick="event.stopPropagation()">

    function openBriefing() {
      let top;
      if (typeof BRIEFING !== "undefined" && BRIEFING.items && BRIEFING.items.length) {
        top = BRIEFING.items.map(it => ({
          title: it.title, voiceId: it.voiceId, signalScore: it.signalScore,
          ago: it.ago, url: it.url, _why: it.why, _voiceName: it.voiceName
        }));
      } else {
        const seen = new Set();
        top = [];
        const sorted = [...CONTENTS].sort((a, b) => (b.signalScore || 0) - (a.signalScore || 0));
        for (const c of sorted) {
          if (seen.has(c.voiceId)) continue;
          seen.add(c.voiceId);
          top.push(c);
          if (top.length >= 7) break;
        }
      }

      const subtitle = (typeof BRIEFING !== "undefined" && BRIEFING.summary)
        ? BRIEFING.summary
        : t("briefing.sub");

      let html = `<div style="position:fixed;inset:0;background:rgba(0,0,0,0.7);z-index:100;display:flex;align-items:center;justify-content:center;padding:20px" id="briefing-modal">
        <div style="background:#0c0c11;border:1px solid rgba(255,255,255,0.1);border-radius:16px;max-width:560px;width:100%;max-height:80vh;overflow:auto;padding:28px">
          <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:20px">
            <div>
              <div style="font-family:'Instrument Serif',serif;font-size:22px">${t("briefing.title")}</div>
              <div style="font-size:12px;color:#71717a;margin-top:2px">${subtitle}</div>
            </div>
            <button onclick="document.getElementById('briefing-modal').remove()" style="background:none;border:none;color:#a1a1aa;font-size:20px;cursor:pointer">×</button>
          </div>
          <div style="display:flex;flex-direction:column;gap:14px">`;

      top.forEach((c, i) => {
        const v = getVoice(c.voiceId) || { name: c._voiceName || c.voiceId };
        const why = c._why || getWhy(c);
        html += `
          <div style="padding:14px;background:rgba(255,255,255,0.03);border:1px solid rgba(255,255,255,0.06);border-radius:12px;cursor:pointer" ${c.url ? `onclick="window.open('${c.url}','_blank')"` : ""}>
            <div style="display:flex;align-items:center;gap:8px;font-size:12px;color:#71717a;margin-bottom:6px">
              <span style="font-weight:600;color:#c4b5fd">${i + 1}</span>
              <span>${v.name || c._voiceName || c.voiceId}</span>
              <span>·</span>
              <span>${c.ago || ""}</span>
              <span style="margin-left:auto;background:rgba(167,139,250,0.12);color:#c4b5fd;padding:2px 7px;border-radius:5px;font-weight:600">${c.signalScore}</span>
            </div>
            <div style="font-size:14px;font-weight:560;margin-bottom:6px;letter-spacing:-0.01em">${c.title}</div>
            <div style="font-size:12.5px;color:#a1a1aa;line-height:1.45">${why}</div>
          </div>`;
      });

      html += `</div>
          <div class="share-row">
            <button type="button" onclick="copyBriefingText()">${t("briefing.copy")}</button>
            <button type="button" onclick="copyBriefingLink()">${t("briefing.link")}</button>
          </div>
          <div style="margin-top:12px;font-size:12px;color:#52525b;text-align:center">${t("briefing.footer")}</div>
        </div>
      </div>`;

      document.body.insertAdjacentHTML("beforeend", html);
    }

    document.querySelector(".btn-primary")?.addEventListener("click", openBriefing);

    // ——— Load live data from JSON (auto-updated by robot) ———
    async function loadLiveData() {
      try {
        const [liveRes, briefRes] = await Promise.all([
          fetch("../data/live-contents.json", { cache: "no-store" }),
          fetch("../data/briefing-latest.json", { cache: "no-store" })
        ]);
        if (liveRes.ok) {
          const live = await liveRes.json();
          if (live.contents && live.contents.length) {
            CONTENTS = live.contents.map(c => ({
              id: c.id,
              voiceId: c.voiceId,
              type: c.type || "video",
              title: c.title,
              description: c.description || "",
              duration: c.duration || "—",
              ago: c.ago || "",
              signalScore: c.signalScore || 8,
              url: c.url || "",
              thumbnail: c.thumbnail || "",
              language: c.language || "en",
              titleFr: c.titleFr || "",
              titleEn: c.titleEn || ""
            }));
            if (live.generatedAt) {
              try {
                const d = new Date(live.generatedAt);
                lastUpdated = d.toLocaleString("fr-FR", { day: "2-digit", month: "short", hour: "2-digit", minute: "2-digit" });
              } catch(e) { lastUpdated = live.generatedAt; }
            } else if (live.updated || live.meta && live.meta.updated) {
              lastUpdated = live.updated || live.meta.updated;
            } else {
              lastUpdated = new Date().toLocaleString("fr-FR", { day: "2-digit", month: "short", hour: "2-digit", minute: "2-digit" });
            }
            console.log("[Lumina] Live contents:", CONTENTS.length, "updated:", lastUpdated);
          }
        }
        if (briefRes.ok) {
          const b = await briefRes.json();
          if (b.items) {
            BRIEFING = b;
            if (!lastUpdated && b.generatedAt) {
              try {
                const d = new Date(b.generatedAt);
                lastUpdated = d.toLocaleString("fr-FR", { day: "2-digit", month: "short", hour: "2-digit", minute: "2-digit" });
              } catch(e) {}
            }
            console.log("[Lumina] Briefing:", b.items.length, "items");
          }
        }
      } catch (e) {
        console.warn("[Lumina] Live fetch failed, using embedded data", e);
      }
      renderFeed();
    }

    // ——— Search & type chips ———
    document.getElementById("search-input")?.addEventListener("input", (e) => {
      searchQuery = e.target.value;
      renderFeed();
    });
    document.querySelectorAll("#type-chips .chip").forEach(btn => {
      btn.addEventListener("click", () => {
        document.querySelectorAll("#type-chips .chip").forEach(b => b.classList.remove("active"));
        btn.classList.add("active");
        typeFilter = btn.dataset.type;
        renderFeed();
      });
    });
    document.addEventListener("keydown", (e) => {
      if (e.target.tagName === "INPUT" || e.target.tagName === "TEXTAREA") {
        if (e.key === "Escape") e.target.blur();
        return;
      }
      if (e.key === "Escape") {
        document.getElementById("player-modal")?.remove();
        document.getElementById("voice-modal")?.remove();
        document.getElementById("briefing-modal")?.remove();
      }
      if (e.key === "/") {
        e.preventDefault();
        document.getElementById("search-input")?.focus();
      }
      if (e.key === "b" || e.key === "B") {
        e.preventDefault();
        openBriefing();
      }
      if (e.key === "c" || e.key === "C") {
        e.preventDefault();
        toggleCompact();
      }
      if (e.key === "v" || e.key === "V") {
        e.preventDefault();
        setView("voices");
      }
      if (e.key === "f" || e.key === "F") {
        e.preventDefault();
        setView("feed");
      }
    });

    document.getElementById("compact-toggle")?.addEventListener("click", toggleCompact);
    document.getElementById("settings-btn")?.addEventListener("click", openSettings);
    document.getElementById("translate-btn")?.addEventListener("click", translateTitles);
    if (localStorage.getItem("lumina-compact") === "1") {
      document.body.classList.add("compact");
      document.getElementById("compact-toggle")?.classList.add("active");
    }
    // Deep link #briefing
    if (location.hash === "#briefing") setTimeout(openBriefing, 400);

    // Lang switcher
    document.querySelectorAll(".lang span").forEach(span => {
      span.style.cursor = "pointer";
      span.addEventListener("click", () => setLang(span.dataset.lang));
    });
    applyLang();

    // Init
    loadLiveData();
  </script>
</body>
</html>
