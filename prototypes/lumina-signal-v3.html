<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Lumina Signal</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #050507;
      --bg-sidebar: #08080c;
      --bg-card: #0c0c11;
      --bg-card-hover: #101016;
      --border: rgba(255,255,255,0.06);
      --border-strong: rgba(255,255,255,0.1);
      --text: #fafafa;
      --text-2: #a1a1aa;
      --text-3: #71717a;
      --accent: #a78bfa;
      --accent-dim: rgba(167, 139, 250, 0.12);
      --green: #34d399;
      --radius: 14px;
      --radius-sm: 9px;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      -webkit-font-smoothing: antialiased;
      line-height: 1.5;
    }
    .header {
      height: 52px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 20px 0 18px;
      border-bottom: 1px solid var(--border);
      background: rgba(5,5,7,0.85);
      backdrop-filter: blur(16px);
      position: sticky;
      top: 0;
      z-index: 50;
    }
    .logo {
      display: flex;
      align-items: center;
      gap: 9px;
      font-size: 14.5px;
      font-weight: 600;
      letter-spacing: -0.03em;
    }
    .logo-icon {
      width: 22px; height: 22px;
      border-radius: 7px;
      background: linear-gradient(145deg, #8b5cf6, #6366f1);
      display: grid; place-items: center;
      font-size: 11px;
      box-shadow: 0 0 0 1px rgba(139,92,246,0.3), 0 4px 12px rgba(139,92,246,0.25);
    }
    .nav {
      display: flex;
      gap: 2px;
      background: rgba(255,255,255,0.03);
      padding: 3px;
      border-radius: 9px;
      border: 1px solid var(--border);
    }
    .nav button {
      background: none; border: none;
      color: var(--text-3);
      font-size: 13px; font-weight: 500;
      padding: 5px 14px;
      border-radius: 6px;
      cursor: pointer;
      font-family: inherit;
      transition: all 0.15s;
    }
    .nav button:hover { color: var(--text-2); }
    .nav button.active {
      background: rgba(255,255,255,0.07);
      color: var(--text);
    }
    .header-actions { display: flex; align-items: center; gap: 10px; }
    .lang {
      display: flex;
      background: rgba(255,255,255,0.03);
      border: 1px solid var(--border);
      border-radius: 7px;
      overflow: hidden;
      font-size: 11.5px; font-weight: 600;
    }
    .lang span {
      padding: 4px 9px; cursor: pointer; color: var(--text-3);
    }
    .lang span.active {
      background: var(--accent-dim); color: var(--accent);
    }
    .shell {
      display: grid;
      grid-template-columns: 240px 1fr 320px;
      height: calc(100vh - 52px);
    }
    .sidebar {
      background: var(--bg-sidebar);
      border-right: 1px solid var(--border);
      padding: 18px 12px;
      overflow-y: auto;
    }
    .side-label {
      font-size: 10.5px; font-weight: 600;
      letter-spacing: 0.06em; text-transform: uppercase;
      color: var(--text-3);
      padding: 0 8px; margin-bottom: 8px; margin-top: 6px;
    }
    .side-item {
      display: flex; align-items: center; gap: 9px;
      padding: 7px 8px; border-radius: 8px;
      font-size: 13px; color: var(--text-2);
      cursor: pointer; transition: all 0.12s;
      margin-bottom: 1px; border: none; background: none;
      width: 100%; text-align: left; font-family: inherit;
    }
    .side-item:hover { background: rgba(255,255,255,0.035); color: var(--text); }
    .side-item.active { background: var(--accent-dim); color: #c4b5fd; }
    .divider { height: 1px; background: var(--border); margin: 16px 8px; }
    .main { overflow-y: auto; padding: 24px 28px 80px; }
    .feed-header {
      display: flex; align-items: flex-end;
      justify-content: space-between; margin-bottom: 22px;
    }
    .feed-title {
      font-family: 'Instrument Serif', Georgia, serif;
      font-size: 26px; font-weight: 400;
      letter-spacing: -0.03em; line-height: 1.1;
    }
    .feed-sub { font-size: 13px; color: var(--text-3); margin-top: 3px; }
    .btn {
      display: inline-flex; align-items: center; gap: 6px;
      height: 32px; padding: 0 13px; border-radius: 8px;
      font-size: 12.5px; font-weight: 550;
      border: none; cursor: pointer; transition: all 0.15s;
      font-family: inherit;
    }
    .btn-primary {
      background: linear-gradient(180deg, #a78bfa, #8b5cf6);
      color: #fff;
      box-shadow: 0 1px 0 rgba(255,255,255,0.12) inset, 0 4px 12px rgba(139,92,246,0.3);
    }
    .btn-primary:hover { filter: brightness(1.08); }
    .btn-ghost {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--text-2);
    }
    .btn-ghost:hover {
      border-color: var(--border-strong);
      color: var(--text);
      background: rgba(255,255,255,0.03);
    }
    .feed { display: flex; flex-direction: column; gap: 10px; }
    .card {
      display: flex; gap: 14px; padding: 14px;
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      cursor: pointer; transition: all 0.18s;
    }
    .card:hover {
      background: var(--bg-card-hover);
      border-color: var(--border-strong);
      transform: translateY(-1px);
      box-shadow: 0 8px 24px rgba(0,0,0,0.25);
    }
    .thumb {
      width: 120px; height: 68px;
      border-radius: 9px; flex-shrink: 0;
      display: grid; place-items: center;
      font-size: 10px; font-weight: 600;
      letter-spacing: 0.04em;
      color: rgba(255,255,255,0.35);
    }
    .thumb.video { background: linear-gradient(145deg, #1e1b4b, #312e81); }
    .thumb.podcast { background: linear-gradient(145deg, #0f172a, #1e3a5f); }
    .card-content { flex: 1; min-width: 0; }
    .card-top {
      display: flex; align-items: center; gap: 7px;
      font-size: 12px; color: var(--text-3); margin-bottom: 5px;
    }
    .card-top .name { color: var(--text-2); font-weight: 500; }
    .badge {
      margin-left: auto;
      font-size: 11px; font-weight: 600;
      color: #c4b5fd; background: var(--accent-dim);
      padding: 2px 7px; border-radius: 5px;
    }
    .card-title {
      font-size: 14.5px; font-weight: 560;
      letter-spacing: -0.015em; line-height: 1.35; margin-bottom: 5px;
    }
    .card-excerpt {
      font-size: 12.5px; color: var(--text-3); line-height: 1.45;
      display: -webkit-box; -webkit-line-clamp: 2;
      -webkit-box-orient: vertical; overflow: hidden;
    }
    /* Voices grid */
    .voices-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 12px;
    }
    .voice-card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 18px;
      cursor: pointer;
      transition: all 0.18s;
    }
    .voice-card:hover {
      border-color: var(--border-strong);
      background: var(--bg-card-hover);
      transform: translateY(-1px);
    }
    .voice-card h3 {
      font-size: 15px; font-weight: 600;
      letter-spacing: -0.02em; margin-bottom: 2px;
    }
    .voice-role { font-size: 12.5px; color: var(--text-3); margin-bottom: 10px; }
    .voice-meta {
      display: flex; align-items: center; gap: 8px;
      font-size: 12px; color: var(--text-3); margin-bottom: 12px;
    }
    .score-pill {
      background: var(--accent-dim); color: #c4b5fd;
      font-weight: 600; padding: 2px 8px; border-radius: 5px;
      font-size: 12px;
    }
    .voice-bio {
      font-size: 12.5px; color: var(--text-2);
      line-height: 1.5;
      display: -webkit-box; -webkit-line-clamp: 3;
      -webkit-box-orient: vertical; overflow: hidden;
    }
    .tags { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 12px; }
    .tag {
      font-size: 11px; padding: 2px 8px; border-radius: 5px;
      background: rgba(255,255,255,0.03);
      border: 1px solid var(--border); color: var(--text-3);
    }
    /* Assistant */
    .assistant-panel {
      border-left: 1px solid var(--border);
      background: var(--bg-sidebar);
      display: flex; flex-direction: column; overflow: hidden;
    }
    .assistant-header {
      padding: 16px 18px 14px;
      border-bottom: 1px solid var(--border);
      display: flex; align-items: center; justify-content: space-between;
    }
    .assistant-title {
      font-size: 13.5px; font-weight: 600;
      display: flex; align-items: center; gap: 8px;
    }
    .assistant-title span {
      width: 8px; height: 8px; border-radius: 50%;
      background: var(--green);
      box-shadow: 0 0 0 3px rgba(52,211,153,0.2);
    }
    .assistant-body {
      flex: 1; padding: 18px; overflow-y: auto;
      display: flex; flex-direction: column; gap: 14px;
    }
    .msg {
      max-width: 95%; font-size: 13px; line-height: 1.5;
    }
    .msg.bot {
      background: rgba(255,255,255,0.03);
      border: 1px solid var(--border);
      border-radius: 12px 12px 12px 4px;
      padding: 12px 14px; color: var(--text-2);
    }
    .msg.bot strong { color: var(--text); font-weight: 560; }
    .suggestions {
      display: flex; flex-direction: column; gap: 6px;
    }
    .suggestion {
      font-size: 12.5px; padding: 8px 12px;
      border-radius: 8px; border: 1px solid var(--border);
      background: transparent; color: var(--text-3);
      text-align: left; cursor: pointer;
      font-family: inherit; transition: all 0.12s;
    }
    .suggestion:hover {
      border-color: rgba(167,139,250,0.3);
      color: #c4b5fd; background: var(--accent-dim);
    }
    .assistant-input {
      padding: 14px 16px; border-top: 1px solid var(--border);
    }
    .input-wrap {
      display: flex; gap: 8px;
      background: rgba(255,255,255,0.03);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 6px 6px 6px 14px;
    }
    .input-wrap:focus-within { border-color: rgba(167,139,250,0.4); }
    .input-wrap input {
      flex: 1; background: transparent; border: none;
      outline: none; color: var(--text);
      font-size: 13px; font-family: inherit;
    }
    .input-wrap input::placeholder { color: var(--text-3); }
    .send-btn {
      width: 32px; height: 32px; border-radius: 8px;
      border: none; background: var(--accent); color: white;
      display: grid; place-items: center; cursor: pointer;
      font-size: 14px;
    }
    .hidden { display: none !important; }
    .empty {
      text-align: center; padding: 60px 20px;
      color: var(--text-3); font-size: 14px;
    }
    @media (max-width: 1100px) {
      .shell { grid-template-columns: 220px 1fr; }
      .assistant-panel { display: none; }
    }
  </style>
</head>

      {"id":"c5","voiceId":"yannic-kilcher","type":"video","title":"TiDAR: Think in Diffusion, Talk in Autoregression","description":"Analyse détaillée d’un papier récent sur les architectures hybrides diffusion/autoregressive.","duration":"47m","ago":"Il y a 4j","signalScore":8.7},
      {"id":"c6","voiceId":"arthur-mensch","type":"video","title":"Open-weight models and European sovereignty","description":"Arthur Mensch sur la stratégie open-weight et la place de l’Europe dans la course à l’IA.","duration":"32m","ago":"Il y a 7j","signalScore":8.9},
      {"id":"c7","voiceId":"nicolas-guyon","type":"podcast","title":"Les agents IA commencent-ils à travailler sans nous ?","description":"Discussion sur l’autonomie croissante des agents et les implications concrètes.","duration":"1h 08m","ago":"Il y a 1j","signalScore":8.4},
      {"id":"c8","voiceId":"yann-lecun","type":"video","title":"Why scaling alone will not lead to AGI","description":"Yann LeCun sur les limites du pure scaling et les architectures alternatives.","duration":"54m","ago":"Il y a 8j","signalScore":9.1}
    ];

    // ——— State ———
    let currentView = "feed";
    let categoryFilter = "all";
    let countryFilter = "all";
    let lang = "fr";

    // ——— Helpers ———
    function getVoice(id) {
      return VOICES.find(v => v.id === id);
    }

    function formatDuration(s) {
      return s; // already formatted in sample
    }

    // ——— Render Feed ———
    function renderFeed() {
      const list = document.getElementById("feed-list");
      let items = CONTENTS;

      if (categoryFilter !== "all") {
        items = items.filter(c => {
          const v = getVoice(c.voiceId);
          return v && v.categories.includes(categoryFilter);
        });
      }
      if (countryFilter !== "all") {
        items = items.filter(c => {
          const v = getVoice(c.voiceId);
          return v && v.countryCode === countryFilter;
        });
      }

      document.getElementById("feed-meta").textContent =
        items.length + " contenu" + (items.length > 1 ? "s" : "") + " · filtrés";

      if (items.length === 0) {
        list.innerHTML = `<div class="empty">Aucun contenu pour ce filtre.</div>`;
        return;
      }

      list.innerHTML = items.map(c => {
        const v = getVoice(c.voiceId) || { name: c.voiceId };
        return `
          <article class="card">
            <div class="thumb ${c.type}">${c.type === "video" ? "YT" : "POD"}</div>
            <div class="card-content">
              <div class="card-top">
                <span class="name">${v.name}</span>
                <span>·</span>
                <span>${c.duration}</span>
                <span>·</span>
                <span>${c.ago}</span>
                <span class="badge">${c.signalScore}</span>
              </div>
              <h3 class="card-title">${c.title}</h3>
              <p class="card-excerpt">${c.description}</p>
            </div>
          </article>
        `;
      }).join("");
    }

    // ——— Render Voices ———
    function renderVoices() {
      const list = document.getElementById("voices-list");
      let items = [...VOICES];

      if (categoryFilter !== "all") {
        items = items.filter(v => v.categories.includes(categoryFilter));
      }
      if (countryFilter !== "all") {
        items = items.filter(v => v.countryCode === countryFilter);
      }

      document.getElementById("voices-meta").textContent =
        items.length + " voix" + (categoryFilter !== "all" || countryFilter !== "all" ? " (filtrées)" : " sélectionnées");

      if (items.length === 0) {
        list.innerHTML = `<div class="empty">Aucune voix pour ce filtre.</div>`;
        return;
      }

      list.innerHTML = items.map(v => `
        <div class="voice-card" data-id="${v.id}">
          <h3>${v.name}</h3>
          <div class="voice-role">${v.role}</div>
          <div class="voice-meta">
            <span>${v.countryCode}</span>
            <span class="score-pill">${v.signalScore}</span>
            <span>${(v.language || []).join(" / ").toUpperCase()}</span>
          </div>
          <p class="voice-bio">${v.bio}</p>
          <div class="tags">
            ${v.categories.map(c => `<span class="tag">${c}</span>`).join("")}
          </div>
        </div>
      `).join("");
    }

    // ——— Navigation ———
    function setView(view) {
      currentView = view;
      document.querySelectorAll(".nav button").forEach(b => {
        b.classList.toggle("active", b.dataset.view === view);
      });
      document.getElementById("view-feed").classList.toggle("hidden", view !== "feed");
      document.getElementById("view-voices").classList.toggle("hidden", view !== "voices");

      if (view === "feed") renderFeed();
      if (view === "voices") renderVoices();
    }

    // ——— Filters ———
    function setCategory(cat) {
      categoryFilter = cat;
      document.querySelectorAll("[data-filter]").forEach(el => {
        el.classList.toggle("active", el.dataset.filter === cat);
      });
      if (currentView === "feed") renderFeed();
      if (currentView === "voices") renderVoices();
    }

    function setCountry(code) {
      countryFilter = code;
      document.querySelectorAll("[data-country]").forEach(el => {
        el.classList.toggle("active", el.dataset.country === code);
      });
      if (currentView === "feed") renderFeed();
      if (currentView === "voices") renderVoices();
    }

    // ——— Assistant (simple demo) ———
    function askAssistant(q) {
      const body = document.getElementById("assistant-body");
      const userMsg = document.createElement("div");
      userMsg.className = "msg bot";
      userMsg.style.alignSelf = "flex-end";
      userMsg.style.background = "var(--accent-dim)";
      userMsg.style.borderColor = "rgba(167,139,250,0.2)";
      userMsg.style.color = "#ddd6fe";
      userMsg.style.borderRadius = "12px 12px 4px 12px";
      userMsg.textContent = q;
      body.appendChild(userMsg);

      let answer = "Je regarde…";

      const lower = q.toLowerCase();
      if (lower.includes("français") || lower.includes("french") || lower.includes("france")) {
        const fr = VOICES.filter(v => v.countryCode === "FR" || (v.language || []).includes("fr"));
        answer = `Voici les principales voix françaises / bilingues :<br><br>` +
          fr.map(v => `<strong>${v.name}</strong> — ${v.role} (${v.signalScore})`).join("<br>");
        setCountry("FR");
        setView("voices");
      } else if (lower.includes("safety") || lower.includes("sécurité") || lower.includes("align")) {
        const safety = VOICES.filter(v => v.categories.includes("Safety")).sort((a,b) => b.signalScore - a.signalScore);
        answer = `Top voix Safety :<br><br>` +
          safety.slice(0,5).map(v => `<strong>${v.name}</strong> — ${v.signalScore}`).join("<br>");
        setCategory("Safety");
        setView("voices");
      } else if (lower.includes("agent")) {
        answer = `Pour les agents, les voix les plus utiles actuellement sont :<br><br>
          <strong>1. swyx & Alessio</strong> (Latent Space) — très fort sur l’engineering d’agents<br>
          <strong>2. Nathan Labenz</strong> — évaluations et capacités réelles<br>
          <strong>3. Nicolas Guyon</strong> — angle francophone et pratique<br><br>
          Je te recommande de commencer par Latent Space.`;
      } else if (lower.includes("open") || lower.includes("open-source") || lower.includes("open source") || lower.includes("mistral") || lower.includes("hugging")) {
        answer = `Pour l’open-source et les modèles ouverts :<br><br>
          <strong>1. Arthur Mensch</strong> (Mistral) — stratégie européenne open-weight<br>
          <strong>2. Thomas Wolf</strong> (Hugging Face) — écosystème open<br>
          <strong>3. Yann LeCun</strong> — défense de l’open research<br><br>
          Ces trois voix sont les plus utiles sur ce sujet.`;
        setCategory("Open-source");
        setView("voices");
      } else if (lower.includes("éducation") || lower.includes("education") || lower.includes("apprendre") || lower.includes("débutant") || lower.includes("pedago")) {
        answer = `Meilleures voix pour apprendre :<br><br>
          <strong>1. Andrej Karpathy</strong> (9.6) — from-scratch, clarté exceptionnelle<br>
          <strong>2. 3Blue1Brown</strong> — intuition mathématique<br>
          <strong>3. Jeremy Howard / fast.ai</strong> — approche pratique<br><br>
          Karpathy reste la référence absolue.`;
        setCategory("Education");
        setView("voices");
      } else if (lower.includes("top") || lower.includes("meilleur") || lower.includes("best") || lower.includes("classement")) {
        const top = [...VOICES].sort((a,b) => b.signalScore - a.signalScore).slice(0,6);
        answer = `Top voix par Signal Score :<br><br>` +
          top.map((v,i) => `<strong>${i+1}. ${v.name}</strong> — ${v.signalScore}`).join("<br>");
        setView("voices");
      } else {
        answer = `Je peux t’aider sur :<br>
          • Voix françaises<br>
          • Safety / alignement<br>
          • Agents<br>
          • Open-source<br>
          • Éducation / apprendre<br>
          • Top scores<br><br>
          Pose ta question ou clique sur une suggestion.`;
      }

      setTimeout(() => {
        const botMsg = document.createElement("div");
        botMsg.className = "msg bot";
        botMsg.innerHTML = answer;
        body.appendChild(botMsg);
        body.scrollTop = body.scrollHeight;
      }, 400);
    }

    // ——— Events ———
    document.querySelectorAll(".nav button").forEach(btn => {
      btn.addEventListener("click", () => setView(btn.dataset.view));
    });
    document.querySelectorAll("[data-filter]").forEach(btn => {
      btn.addEventListener("click", () => setCategory(btn.dataset.filter));
    });
    document.querySelectorAll("[data-country]").forEach(btn => {
      btn.addEventListener("click", () => setCountry(btn.dataset.country));
    });
    document.querySelectorAll(".suggestion").forEach(btn => {
      btn.addEventListener("click", () => askAssistant(btn.dataset.q));
    });
    document.getElementById("send-btn").addEventListener("click", () => {
      const input = document.getElementById("assistant-input");
      if (input.value.trim()) {
        askAssistant(input.value.trim());
        input.value = "";
      }
    });
    document.getElementById("assistant-input").addEventListener("keydown", e => {
      if (e.key === "Enter") document.getElementById("send-btn").click();
    });

    // Init
    renderFeed();
  </script>
</body>
</html>
